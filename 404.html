<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Ravinthra A</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- ==================== SECURITY HEADERS ==================== -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src  'self';
    style-src   'self' https://fonts.googleapis.com;
    font-src    https://fonts.gstatic.com;
    img-src     'self' data:;
    connect-src 'none';
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
    form-action 'none';
    upgrade-insecure-requests;
  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), payment=(), geolocation=()">
  <meta http-equiv="X-Frame-Options" content="DENY">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26A1;</text></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Shared base tokens -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/404.css">
</head>
<body>

  <!-- Logo / nav back -->
  <div class="nav-hint">
    <a href="index.html" class="nav-logo">RA</a>
  </div>

  <!-- Particle canvas -->
  <canvas id="canvas-404" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <!-- Main content -->
  <main class="content">
    <div class="error-code">404</div>
    <div class="label">Page Not Found</div>
    <h1 class="headline">You've drifted into deep space<span class="cursor-blink"></span></h1>
    <p class="sub">
      The page you're looking for doesn't exist, was moved,
      or got lost somewhere in the void. Let's get you back.
    </p>
    <div class="btn-row">
      <a href="index.html" class="btn">← Back to Portfolio</a>
      <a href="index.html#contact" class="btn btn-ghost">Get in Touch</a>
    </div>
  </main>

  <script src="js/cursor.js" defer></script>
  <script src="js/particles-404.js"></script>

</body>
</html>
